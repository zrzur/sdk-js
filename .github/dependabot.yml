version: 2
# One pull request per ecosystem and week, against beta. A dependency pull
# request cannot pass "Source integrity" on its own: the reviewed manifest
# (PUBLIC_SOURCE_MANIFEST.json) must be regenerated by a maintainer on the
# branch after review, then it is merged into beta.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
